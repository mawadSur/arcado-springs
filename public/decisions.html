<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <title>Owner Briefing — Arcado Springs</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" />
  <link rel="stylesheet" href="/styles.css" />
  <style>
    /* Page-scoped styles; tokens come from the site's styles.css */
    body { background: var(--bg); }
    .db-wrap { max-width: 900px; margin: 0 auto; padding: 40px 20px 80px; }
    .db-lock { max-width: 460px; margin: 14vh auto 0; background: var(--surface); border: 1px solid var(--line);
      border-radius: var(--radius-lg); padding: 34px 32px; box-shadow: var(--shadow-md); text-align: center; }
    .db-lock h1 { font-family: var(--font-head); font-size: 26px; margin: 0 0 6px; }
    .db-lock p { color: var(--muted); font-size: 14.5px; margin: 0 0 18px; }
    .db-lock input { width: 100%; box-sizing: border-box; font-family: var(--font-mono); font-size: 13px;
      padding: 11px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--text); }
    .db-lock button { margin-top: 12px; width: 100%; padding: 11px; border: 0; border-radius: 10px;
      background: var(--accent); color: #fff; font-weight: 600; font-size: 15px; cursor: pointer; }
    .db-lock button:hover { background: var(--accent-dk); }
    .db-lock .err { color: #A6432D; font-size: 13.5px; margin-top: 10px; display: none; }
    .db-head { border-bottom: 2px solid var(--text); padding-bottom: 14px; margin-bottom: 10px; }
    .db-eyebrow { font-family: var(--font-mono); font-size: 12px; letter-spacing: .12em; text-transform: uppercase;
      color: var(--accent2-ink); margin: 0 0 10px; }
    .db-wrap h1 { font-family: var(--font-head); font-weight: 600; font-size: clamp(28px, 4.5vw, 40px); line-height: 1.1; margin: 0 0 10px; }
    .db-lede { color: var(--muted); max-width: 66ch; }
    .db-wrap h2 { font-family: var(--font-head); font-weight: 600; font-size: 23px; margin: 42px 0 10px; }
    .db-wrap h3 { font-family: var(--font-head); font-weight: 600; font-size: 17px; margin: 24px 0 6px; }
    .db-wrap p { line-height: 1.6; max-width: 70ch; }
    .db-wrap code { font-family: var(--font-mono); font-size: .86em; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 1px 5px; }
    .db-grid4 { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; margin: 18px 0; }
    .db-tile { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
    .db-tile .k { font-family: var(--font-mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
    .db-tile .v { font-family: var(--font-head); font-size: 26px; font-weight: 600; margin: 3px 0 2px; }
    .db-tile .s { font-size: 12.5px; color: var(--muted); line-height: 1.45; }
    .db-tblwrap { overflow-x: auto; margin: 14px 0; }
    .db-wrap table { border-collapse: collapse; width: 100%; font-size: 14px; background: var(--surface);
      border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
    .db-wrap th { font-family: var(--font-mono); font-size: 11px; letter-spacing: .07em; text-transform: uppercase;
      color: var(--muted); text-align: left; font-weight: 500; padding: 9px 12px; border-bottom: 1px solid var(--line); }
    .db-wrap td { padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
    .db-wrap tr:last-child td { border-bottom: none; }
    .db-wrap td.num, .db-wrap th.num { text-align: right; font-family: var(--font-mono); font-size: 13px; white-space: nowrap; }
    .num.pos, .pos { color: #2E63AD; font-weight: 600; } .num.neg, .neg { color: #B03E24; font-weight: 600; }
    .neg-t { color: #B03E24; }
    tr.hi td { background: rgba(46, 99, 173, .08); }
    .db-chart { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px 18px 8px; margin: 18px 0; }
    .db-chart-scroll { overflow-x: auto; }
    .db-note { font-size: 13.5px; color: var(--muted); }
    .db-options { display: grid; gap: 12px; margin: 16px 0; }
    .db-opt { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 15px 18px; }
    .db-opt.rec { border-left: 4px solid var(--accent); }
    .db-opt .t { font-weight: 600; margin-bottom: 4px; }
    .db-opt .d { font-size: 14.5px; color: var(--text); line-height: 1.55; }
    .db-kill { list-style: none; padding: 0; display: grid; gap: 7px; }
    .db-kill li { background: rgba(176, 62, 36, .08); border-radius: 10px; padding: 10px 14px 10px 36px; position: relative; font-size: 14px; line-height: 1.5; }
    .db-kill li::before { content: "✕"; position: absolute; left: 13px; color: #B03E24; font-weight: 700; }
    .db-steps { padding-left: 22px; display: grid; gap: 10px; }
    .db-steps li { line-height: 1.55; }
    .db-week { list-style: none; padding: 0; display: grid; gap: 8px; }
    .db-week li { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 11px 15px 11px 38px; position: relative; font-size: 14.5px; }
    .db-week li::before { content: "→"; position: absolute; left: 14px; color: var(--accent); font-weight: 700; }
    .db-foot { margin-top: 48px; border-top: 1px solid var(--line); padding-top: 16px; font-size: 13px; color: var(--muted); }
    .db-foot p { max-width: none; }
  </style>
</head>

        }).then(function (buf) {
          var doc = document.getElementById('doc');
          doc.innerHTML = new TextDecoder().decode(buf);
          document.getElementById('lock').style.display = 'none';
          doc.hidden = false;
          try { sessionStorage.setItem('dbk', keyStr.trim()); } catch (e) {}
          document.title = 'Owner Briefing — Arcado Springs';
        });
      }
      function fail() { var e = document.getElementById('err'); e.style.display = 'block'; }
      var fromHash = (location.hash.match(/[#&]k=([^&]+)/) || [])[1];
      var stored = null;
      try { stored = sessionStorage.getItem('dbk'); } catch (e) {}
      if (fromHash) tryKey(decodeURIComponent(fromHash)).catch(fail);
      else if (stored) tryKey(stored).catch(function () {});
      document.getElementById('unlock').addEventListener('click', function () {
        tryKey(document.getElementById('keyin').value).catch(fail);
      });
      document.getElementById('keyin').addEventListener('keydown', function (ev) {
        if (ev.key === 'Enter') tryKey(ev.target.value).catch(fail);
      });
    })();
  </script>
</body>
</html>
